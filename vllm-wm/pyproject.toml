[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-wm"
version = "0.1.0"
authors = [{ name = "OpenAI Codex" }]
license = { text = "MIT" }
readme = "README.md"
description = "A minimal vLLM-style unified backend for interactive world models."
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "pydantic>=2.8.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
vllm-wm = "vllm_wm.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["vllm_wm*", "services*", "vendors*", "assets*"]
namespaces = true
